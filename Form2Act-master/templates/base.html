<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Form2Act{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  {% block head %}{% endblock %}
</head>
<body data-merge-fields='{{ merge_fields | tojson }}' data-diploma-fields='{{ diploma_fields | tojson }}' data-preview-labels='{{ preview_labels | tojson }}'>
  <div class="app">
    {% include "partials/header.html" %}
    {% include "partials/tabs.html" %}
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.5/dist/docx-preview.min.js"></script>
  <script src="{{ url_for('static', filename='js/preview-word.js') }}"></script>
  <script src="{{ url_for('static', filename='js/f2a-core.js') }}"></script>
  <script src="{{ url_for('static', filename='js/f2a-protocols.js') }}"></script>
  <script src="{{ url_for('static', filename='js/f2a-preview.js') }}"></script>
  <script src="{{ url_for('static', filename='js/constructor.js') }}"></script>
  <script src="{{ url_for('static', filename='js/diploma.js') }}"></script>
  <script src="{{ url_for('static', filename='js/commission.js') }}"></script>
  <script src="{{ url_for('static', filename='js/settings.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
